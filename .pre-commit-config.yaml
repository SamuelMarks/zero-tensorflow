repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format --check .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check
        entry: ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: Mypy Type Check
        entry: mypy --config-file pyproject.toml src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: interrogate
        name: Interrogate Docstring Coverage
        entry: interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-cov
        name: Pytest Coverage
        entry: pytest --cov=src/zero_tensorflow --cov=scripts --cov-branch --cov-fail-under=100 -m "not reference"
        language: system
        types: [python]
        pass_filenames: false

      - id: check-imports
        name: Check Disallowed Imports
        entry: python3 scripts/check_imports.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-api-parity
        name: Check API Parity
        entry: python3 scripts/check_api_parity.py
        language: system
        types: [python]
        pass_filenames: false

      - id: update-badges
        name: Update README Badges
        entry: python3 scripts/update_badges.py --enforce
        language: system
        pass_filenames: false
