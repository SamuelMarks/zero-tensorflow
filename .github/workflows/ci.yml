name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  UV_DYNAMIC_VERSIONING_BYPASS: "2.2.0"
  PDM_BUILD_SCM_VERSION: "2.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Checkout Ecosystem Sibling Repositories
      run: |
        git clone --depth 1 https://github.com/SamuelMarks/ml-switcheroo-ir.git ../ml-switcheroo-ir
        git clone --depth 1 https://github.com/SamuelMarks/ml-switcheroo-compiler.git ../ml-switcheroo-compiler
        git clone --depth 1 https://github.com/SamuelMarks/zero-keras.git ../zero-keras

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build pytest pytest-cov ruff mypy interrogate
        pip install "ml-ecosystem-snapshots @ https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/ml_ecosystem_snapshots-0.0.5-py3-none-any.whl"
        mkdir -p ~/.cache/ml_ecosystem_snapshots
        curl -sL "https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/tensorflow_v2.21.0.json" -o ~/.cache/ml_ecosystem_snapshots/tensorflow_v2.21.0.json
        pip install -r requirements-test.txt
        pip install -e ../ml-switcheroo-ir
        pip install -e ../ml-switcheroo-compiler
        pip install -e ../zero-keras
        pip install -e .

    - name: Lint and Format Check (Ruff)
      run: |
        ruff format --check .
        ruff check .

    - name: Check Docstring Coverage (Interrogate)
      run: interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests

    - name: Static Type Check (Mypy)
      run: mypy --config-file pyproject.toml src scripts tests

    - name: Check Disallowed 3rd-Party Imports
      run: python3 scripts/check_imports.py

    - name: Check API Parity
      run: python3 scripts/check_api_parity.py

    - name: Run Unit Tests and Enforce 100% Coverage
      run: pytest --cov=src/zero_tensorflow --cov=scripts --cov-branch --cov-report=term-missing --cov-report=json --cov-fail-under=100 -m "not reference"

    - name: Run Reference Parity Tests
      run: pytest -m "reference"

    - name: Verify README Coverage Badges
      run: python3 scripts/update_badges.py --enforce

    - name: Build Package
      run: python -m build
