[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "zero-tensorflow"
version = "2.20.0"
description = "Zero-dependency pure Python implementation of the TensorFlow API surface."
authors = [{ name = "Samuel Marks" }]
requires-python = ">=3.9"
dynamic = ["dependencies", "optional-dependencies"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
test = ["requirements-test.txt"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint]
ignore = ['E402']

[tool.mypy]
ignore_missing_imports = true

[tool.uv.sources]
ml-switcheroo-compiler = { path = "../ml-switcheroo-compiler", editable = true }
ml-switcheroo-ir = { path = "../ml-switcheroo-ir", editable = true }
zero-keras = { path = "../zero-keras", editable = true }
